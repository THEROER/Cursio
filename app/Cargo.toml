[package]
name = "cursio-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "cursio-app"
path = "src/main.rs"

# What Android loads: Tauri's mobile entry point is a library the Activity
# opens, and the phone's node and its JNI natives ship inside it.
[lib]
name = "cursio_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Serve the bundled `ui/.output/public` instead of `devUrl`. Default-on because
# xtask builds with plain cargo: without it Tauri builds in dev mode and the
# window loads whatever answers on `devUrl` — another project's dev server, if
# one is running. `tauri dev` switches it off itself.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.0.0-beta.18", features = [] }

[dependencies]
# The mesh core and the control client, none of the platform modules: the app
# never runs the node, and the node's window module links GTK4, which cannot
# share a process with the webview's GTK3. By path, not `workspace = true`,
# which would ignore `default-features = false`.
cursio-core = { path = "../crates/core", default-features = false }
cursio-protocol.workspace = true
cursio-transport.workspace = true
# `tray-icon`: the notification-area icon is the app on a desktop.
tauri = { version = "2.0.0-beta.20", features = ["tray-icon"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
tokio.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
tauri-plugin-single-instance.workspace = true
tauri-plugin-dialog.workspace = true
# A gallery item copied as a file, for a file manager or a chat to paste.
clipboard-core.workspace = true

# On a phone the app is the node: no separate `cursio` process can live there,
# so the mesh runs in this process, owned by the foreground service.
[target.'cfg(target_os = "android")'.dependencies]
cursio-android = { path = "../crates/android" }
