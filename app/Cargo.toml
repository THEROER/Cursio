[package]
name = "cursio-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "cursio-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0.0-beta.18" }

[dependencies]
# The mesh core and the control client, none of the platform modules: the app
# never runs the node, and the node's window module links GTK4, which cannot
# share a process with the webview's GTK3. By path, not `workspace = true`,
# which would ignore `default-features = false`.
cursio-core = { path = "../crates/core", default-features = false }
cursio-protocol.workspace = true
cursio-transport.workspace = true
# `tray-icon`: the notification-area icon is the app on a desktop.
tauri = { version = "2.0.0-beta.20", features = ["tray-icon"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
tokio.workspace = true
