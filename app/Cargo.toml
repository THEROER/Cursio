[package]
name = "cursio-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cursio-app"
path = "src/main.rs"

# What Android loads: Tauri's mobile entry point is a library the Activity
# opens, and the phone's node and its JNI natives ship inside it.
[lib]
name = "cursio_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Serve the bundled `ui/.output/public` instead of `devUrl`. Default-on because
# xtask builds with plain cargo: without it Tauri builds in dev mode and the
# window loads whatever answers on `devUrl` — another project's dev server, if
# one is running. `tauri dev` switches it off itself.
default = ["custom-protocol", "wry"]
custom-protocol = ["tauri/custom-protocol"]
# The engine that draws the window: the platform webview (WebKitGTK, WebView2,
# WKWebView).
wry = ["dep:tauri-runtime-wry", "tauri/gtk3"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
# The mesh core and the control client, none of the platform modules: the app
# never runs the node, and the node's window module links GTK4, which cannot
# share a process with the webview's GTK3. By path, not `workspace = true`,
# which would ignore `default-features = false`.
cursio-core = { path = "../crates/core", default-features = false }
cursio-protocol.workspace = true
cursio-transport.workspace = true
tauri.workspace = true
tauri-runtime-wry = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
tokio.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
tauri-plugin-single-instance.workspace = true
tauri-plugin-dialog.workspace = true
# A gallery item copied as a file, for a file manager or a chat to paste.
clipboard-core.workspace = true

# On a phone the app is the node: no separate `cursio` process can live there,
# so the mesh runs in this process, owned by the foreground service.
# The notification-area icon is the app on Windows and macOS. On Linux the
# node draws it (`node_tray`), and Tauri's would be one too many; it would not
# even build here, being `ksni` on `async-io` where the node's is on tokio,
# two features of one crate that refuse each other.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tauri = { workspace = true, features = ["tray-icon"] }

[target.'cfg(target_os = "android")'.dependencies]
cursio-android = { path = "../crates/android" }
