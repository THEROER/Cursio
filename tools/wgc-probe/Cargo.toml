[package]
name = "wgc-probe"
version.workspace = true
edition.workspace = true
publish = false

# A standalone Windows probe, deliberately NOT an example inside cursio-window:
# that crate pulls in GTK and ffmpeg for its Linux backends, neither of which
# cross-compiles to Windows from this machine. Keeping it separate means it can
# be built for Windows from Ubuntu with nothing but the `windows` crate.

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
] }
