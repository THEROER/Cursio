[package]
name = "cursio-log"
version.workspace = true
edition.workspace = true

# Deliberately tiny: console + rotating-file logging setup, shared by every
# Cursio binary (cursio, clipd, cursio-app). Kept out of cursio-core so clipd
# doesn't pull the whole transport/audio stack just to log to a file.
[dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
directories.workspace = true

# A fresh Windows console (notably the one a UAC re-launch opens) starts with
# VT sequence processing OFF, so our coloured output arrives as raw escape
# codes. Two console functions are enough to turn it on — see logging's
# `enable_ansi_on_windows`.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
