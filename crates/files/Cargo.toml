[package]
name = "cursio-files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cursio-protocol.workspace = true
tracing.workspace = true
thiserror.workspace = true
anyhow.workspace = true
# The share policy is plain data a config file carries; see share.rs.
serde.workspace = true
# Frames between the node and the process presenting a mount; see relay.rs.
bincode.workspace = true
# Only for the channel the mount uses to reach the async session; no filesystem
# work runs on the runtime (see mount::bridge).
tokio = { workspace = true }
# Compresses file chunks when that actually shrinks them; see protocol::Chunk.
zstd = "0.13"

# The mount side runs a FUSE filesystem. `fuser` talks the kernel's FUSE ABI
# directly over /dev/fuse, so it needs no libfuse-dev at build time — only
# fusermount3 at runtime, which is part of a normal desktop install.
[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.18", default-features = false }
libc = "0.2"

# `statvfs` for the capacity a served volume reports. No mount half here — macOS
# FUSE is a kernel extension the user has to install and approve — so this is
# the only native call the platform needs.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# A phone serves its shared storage and never mounts anything, so only the
# calls the server half makes: `statvfs` for capacity, `fallocate` for a
# reservation, `setpriority` for the worker threads.
[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

[features]
# Mounting a peer's volumes on Windows: WinFsp. `winfsp-sys` is GPL-3.0, so a
# build that only serves this machine's disks — a product embedding Cursio,
# or a node that leaves mounting to the separate `cursio-mount-helper`
# executable — leaves it out and links no GPL code for files. Linux mounting
# (`fuser`, MIT) is not behind it: it carries no such license, and a Linux
# node that cannot mount is not a build anyone asked for.
mount = ["dep:winfsp", "dep:widestring", "dep:windows"]

# Windows mounting goes through WinFsp. Gated on the MSVC environment, not just
# on Windows: `winfsp-sys` refuses any other triple outright (its build script
# panics with "unsupported triple" on MinGW), so the MinGW cross-build that
# `cargo xtask windows` performs must not see this dependency at all. Build the
# mounting half with `cargo xwin --target x86_64-pc-windows-msvc`.
[target.'cfg(all(target_os = "windows", target_env = "msvc"))'.dependencies]
# NOT the `debug` feature: it routes WinFsp's diagnostics to stderr via
# `GetStdHandle(...).unwrap()`, which panics or yields a useless handle when the
# process has no console — and the filesystem then stops answering entirely,
# losing even the UNC path that worked without it.
winfsp = { version = "0.13", optional = true }
widestring = { version = "1", optional = true }
windows = { version = "0.61", features = ["Win32_Foundation"], optional = true }

# Just `GetDiskFreeSpaceExW`, for the capacity a volume reports. `windows-sys`
# rather than `windows`: this is one raw call with no COM or lifetime handling
# to gain from the safe wrappers.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    # `CloseHandle`, for the process queried to name a disk walker; see walk.rs.
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    # Lowering the priority of the file worker threads; see background.rs.
    "Win32_System_Threading",
    # Locating and loading WinFsp's side-by-side DLL; see winmount::fs.
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    # Mapping the drive letter onto the UNC share, as `net use` does.
    "Win32_NetworkManagement_WNet",
    # `DRIVE_REMOVABLE`, for telling a stick from a fixed disk.
    "Win32_System_WindowsProgramming",
    # `FSCTL_SET_SPARSE`, so the read cache's data files keep their holes;
    # see readcache.rs.
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[dev-dependencies]
tempfile = "3"
serde_json.workspace = true
