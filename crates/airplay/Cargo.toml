[package]
name = "cursio-airplay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cursio-transport.workspace = true

aes.workspace = true
cbc.workspace = true
ctr.workspace = true
ed25519-dalek.workspace = true
mdns-sd.workspace = true
rand.workspace = true
sha2.workspace = true
tokio.workspace = true
plist.workspace = true
x25519-dalek.workspace = true

thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
gstreamer.workspace = true
gstreamer-app.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
serde_json.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
# The mirroring window Cursio owns, so the sink does not open an unnamed one of
# its own. Same Win32 surface `cursio-window`'s surrogate uses.
gstreamer-video.workspace = true
windows = { version = "0.61", features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
clap.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
cc.workspace = true
