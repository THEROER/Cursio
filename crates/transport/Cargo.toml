[package]
name = "cursio-transport"
version.workspace = true
edition.workspace = true

[dependencies]
cursio-protocol.workspace = true

tokio.workspace = true
futures.workspace = true
async-trait.workspace = true

mdns-sd.workspace = true
if-addrs = "0.13"

snow.workspace = true
spake2.workspace = true
rand.workspace = true
sha2.workspace = true

directories.workspace = true
serde.workspace = true
serde_json.workspace = true

thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

# `setsockopt` for `TCP_NOTSENT_LOWAT`, which tokio does not expose; see
# `send_backlog`.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# `SIO_IDEAL_SEND_BACKLOG_QUERY` and `SO_SNDBUF`, the Windows substitute for
# `TCP_NOTSENT_LOWAT`; see `send_backlog`.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Networking_WinSock",
    # `WSAIoctl`'s signature names `OVERLAPPED`, even when none is passed.
    "Win32_System_IO",
] }

[dev-dependencies]
# `start_paused`, so a resumable session's one-minute hold runs out in
# virtual time.
tokio = { version = "1", features = ["full", "test-util"] }
