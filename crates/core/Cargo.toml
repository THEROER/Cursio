[package]
name = "cursio-core"
version.workspace = true
edition.workspace = true

[[bin]]
name = "cursio"
path = "src/bin/cursio.rs"
# The CLI drives every platform module, so it exists only in a build that has
# them. A phone links the library into an app; there is no terminal to run this
# from and nothing on Android that `--send-input` could capture.
required-features = ["desktop"]

# What a build of this crate includes. The default is every desktop subsystem,
# so a plain `cargo build -p cursio-core` is exactly what it always was.
#
# The split exists because the mesh core — identity, link, session, registry,
# module dispatch, node status — depends on *none* of the platform crates.
# Nothing in `link.rs`, `session.rs`, `mesh.rs` or `registry.rs` imports one;
# only the four `*_session.rs` policy files do. Android proves that separation
# was real rather than aspirational: a phone builds the mesh and the modules it
# can actually implement, and pulls in neither PipeWire, nor a FUSE mount, nor
# an AirPlay receiver — none of which exist there.
#
# Each feature gates one `*_session.rs` and the platform crate behind it, so a
# module that is off costs nothing to compile and cannot be negotiated on.
[features]
default = ["desktop"]
desktop = ["audio", "input", "window", "files", "airplay", "usb"]
audio = ["dep:cursio-audio"]
input = ["dep:cursio-input"]
window = ["dep:cursio-window"]
files = ["dep:cursio-files"]
usb = ["dep:cursio-usb"]
# AirPlay carries a window back to the mesh, so it cannot be built without the
# window module to carry it through.
airplay = ["dep:cursio-airplay", "window"]

[dependencies]
cursio-protocol.workspace = true
cursio-transport.workspace = true
cursio-airplay = { workspace = true, optional = true }
cursio-input = { workspace = true, optional = true }
cursio-audio = { workspace = true, optional = true }
cursio-window = { workspace = true, optional = true }
cursio-files = { workspace = true, optional = true }
cursio-usb = { workspace = true, optional = true }
# Compresses file chunks when it pays; see files_session::pack.
zstd = "0.13"
# Clipboard sharing: the platform layer (read/write/watch) the session module
# drives on a worker thread. Same crate `clipd` uses, so the two compose for
# free — content received from a peer lands on the local clipboard.
clipboard-core.workspace = true

async-trait.workspace = true
tokio.workspace = true

serde.workspace = true
serde_json.workspace = true

thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Console + rotating-file logging, shared across binaries. Re-exported as
# `cursio_core::logging` for the historical path.
cursio-log.workspace = true
uuid.workspace = true
clap.workspace = true
hostname.workspace = true
directories.workspace = true
zeroize = "1"

[target.'cfg(unix)'.dependencies]
# Turning off terminal echo for the pairing prompt ourselves: rpassword 7.5 also
# clears ISIG, and on Ctrl-C it raises SIGINT before restoring the terminal.
libc.workspace = true

[target.'cfg(not(unix))'.dependencies]
rpassword = "7"

[target.'cfg(target_os = "windows")'.dependencies]
# Self-elevation at startup: without admin rights, Windows' UIPI silently drops
# injected input aimed at higher-integrity windows (an elevated console, Task
# Manager), so the peer's mouse appears dead over exactly those windows.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    # OpenProcessToken/GetTokenInformation — are we already elevated?
    "Win32_Security",
    "Win32_System_Threading",
    # ShellExecuteExW with the "runas" verb — the actual UAC prompt.
    # SHELLEXECUTEINFOW carries an HKEY field, so the binding is gated on
    # Win32_System_Registry even though we never touch the registry.
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
    # GetSystemPowerStatus — battery level and mains state for `NodeStatus`,
    # in one call that needs neither WMI nor a COM apartment.
    "Win32_System_Power",
] }

[dev-dependencies]
# `start_paused` for time-dependent tests (liveness timeouts) — lets a 15s
# timeout elapse in virtual time instead of really waiting.
tokio = { version = "1", features = ["full", "test-util"] }
