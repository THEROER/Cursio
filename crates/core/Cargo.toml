[package]
name = "cursio-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cursio"
path = "src/bin/cursio/main.rs"
# The CLI drives every platform module, so it exists only in a build that has
# them. A phone links the library into an app; there is no terminal to run this
# from and nothing on Android that `--send-input` could capture. Spelled out
# rather than `desktop` so the node builds without `files-mount` too: then it
# mounts through `cursio-mount-helper` and links no WinFsp itself.
required-features = ["audio", "input", "window", "files", "airplay", "usb", "calls", "bluetooth", "gallery"]

[[bin]]
name = "cursio-mount-helper"
path = "src/bin/cursio-mount-helper.rs"
# The process that holds a peer's drives on Windows, apart from the node: the
# one executable that carries WinFsp's GPL bindings. See `mount_helper.rs`.
required-features = ["files-mount"]

# What a build of this crate includes. The default is every desktop subsystem,
# so a plain `cargo build -p cursio-core` is exactly what it always was.
#
# The split exists because the mesh core — identity, link, session, registry,
# module dispatch, node status — depends on *none* of the platform crates.
# Nothing in `link.rs`, `session.rs`, `mesh.rs` or `registry.rs` imports one;
# only the four `*_session.rs` policy files do. Android proves that separation
# was real rather than aspirational: a phone builds the mesh and the modules it
# can actually implement, and pulls in neither PipeWire, nor a FUSE mount, nor
# an AirPlay receiver — none of which exist there.
#
# Each feature gates one `*_session.rs` and the platform crate behind it, so a
# module that is off costs nothing to compile and cannot be negotiated on.
[features]
default = ["desktop"]
desktop = ["audio", "input", "window", "files", "files-mount", "airplay", "usb", "calls", "bluetooth", "gallery", "phone-control", "web-tools"]
# `cursio mcp`'s `web_*` tools: a DevTools-protocol client for an
# application's web view on another machine (docs/devtools-design.md).
web-tools = ["dep:tokio-tungstenite", "dep:futures"]
audio = ["dep:cursio-audio", "cursio-hubs/audio"]
input = ["dep:cursio-input"]
window = ["dep:cursio-window"]
files = ["dep:cursio-files", "dep:cursio-files-session", "cursio-clipboard-session/files"]
# Mounting a peer's volumes on Windows in this binary: links WinFsp's GPL-3.0
# bindings. Without it a Windows node still mounts, through the separate
# `cursio-mount-helper` executable beside it, and the node itself carries no
# GPL code for files — what a closed product embedding Cursio needs. See
# THIRD-PARTY.md.
files-mount = ["files", "cursio-files/mount", "cursio-files-session/files-mount"]
usb = ["dep:cursio-usb-session"]
# A phone's calls with their voice on this computer: the Bluetooth hands-free
# unit, whose audio rides the audio module's playback and microphone.
calls = ["dep:cursio-bluetooth", "audio"]
# The mesh over Bluetooth: an RFCOMM channel paired phones open when the
# network is not there. Only the socket comes from BlueZ; what crosses it is
# the mesh itself.
bluetooth = ["dep:cursio-bluetooth"]
# This computer's Pictures and Videos for peers to browse: a folder walk and a
# thumbnail decoder. A phone answers from its MediaStore instead, and browses
# a peer's gallery without this.
gallery = ["dep:image", "cursio-exchange/gallery"]
# A phone's screen read as a picture by a program here (`cursio phone`, the
# MCP tools): the screen's H.264 decoded once and written as PNG.
phone-control = ["window", "dep:image"]
# AirPlay carries a window back to the mesh, so it cannot be built without the
# window module to carry it through.
airplay = ["dep:cursio-airplay", "window"]

[dependencies]
# Identity, the module API and host, config and health: what the module
# crates share with the core. Re-exported under the old paths.
cursio-core-base.workspace = true
# Where a phone's calls, notifications and players meet this machine.
cursio-hubs.workspace = true
# The request-and-answer modules: messages, the gallery, diagnostics' hub.
cursio-exchange.workspace = true
# Placing a duty that must live on one machine, such as the AirPlay receiver.
cursio-service-session.workspace = true
cursio-usb-session = { workspace = true, optional = true }
cursio-files-session = { workspace = true, optional = true }
cursio-clipboard-session.workspace = true
cursio-queue.workspace = true
cursio-protocol.workspace = true
cursio-app-protocol.workspace = true
cursio-transport.workspace = true
cursio-wifidirect.workspace = true
cursio-airplay = { workspace = true, optional = true }
cursio-input = { workspace = true, optional = true }
cursio-audio = { workspace = true, optional = true }
cursio-window = { workspace = true, optional = true }
cursio-files = { workspace = true, optional = true }
cursio-bluetooth = { workspace = true, optional = true }
image = { workspace = true, optional = true }
# Thumbnails cross the control socket's JSON as text.
base64.workspace = true
tokio-tungstenite = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
# Compresses file chunks when it pays; see files_session::pack.
zstd = "0.13"
# Build manifests: every installed file is checked against its sha256.
sha2.workspace = true
# Blobs between copies of an application, named by their manifests' sha1.
sha1.workspace = true
# Builds arriving from the mesh are signed; a peer being paired is not enough
# to replace the program.
ed25519-dalek.workspace = true
# Clipboard sharing: the platform layer (read/write/watch) the session module
# drives on a worker thread. Same crate `clipd` uses, so the two compose for
# free — content received from a peer lands on the local clipboard.
clipboard-core.workspace = true

async-trait.workspace = true
tokio.workspace = true

serde.workspace = true
serde_json.workspace = true

thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Console + rotating-file logging, shared across binaries. Re-exported as
# `cursio_core::logging` for the historical path.
cursio-log.workspace = true
uuid.workspace = true
clap.workspace = true
directories.workspace = true
toml.workspace = true
zeroize = "1"
# Pairing codes: drawn from the OS generator, since the code is the secret.
rand.workspace = true

[target.'cfg(unix)'.dependencies]
# Turning off terminal echo for the pairing prompt ourselves: rpassword 7.5 also
# clears ISIG, and on Ctrl-C it raises SIGINT before restoring the terminal.
libc.workspace = true

[target.'cfg(not(unix))'.dependencies]
rpassword = "7"

# A phone's notifications shown through the desktop's own notification server,
# and the user's idle time from Mutter; see notify_display.rs and presence.rs.
[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true
# The node's notification-area icon, over that same zbus; see node_tray.rs.
ksni.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
# Self-elevation at startup: without admin rights, Windows' UIPI silently drops
# injected input aimed at higher-integrity windows (an elevated console, Task
# Manager), so the peer's mouse appears dead over exactly those windows.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    # OpenProcessToken/GetTokenInformation — are we already elevated?
    "Win32_Security",
    # SDDL → security descriptor and SID → string, for the control pipe's
    # owner-only DACL.
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    # GetConsoleWindow — whether a relaunched copy should have a window.
    "Win32_System_Console",
    # ShellExecuteExW with the "runas" verb — the actual UAC prompt.
    # SHELLEXECUTEINFOW carries an HKEY field, so the binding is gated on
    # Win32_System_Registry even though we never touch the registry.
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
    # GetSystemPowerStatus — battery level and mains state for `NodeStatus`,
    # in one call that needs neither WMI nor a COM apartment.
    "Win32_System_Power",
    # GlobalMemoryStatusEx — commit charge against its limit, for the pressure
    # monitor; see pressure.rs.
    "Win32_System_SystemInformation",
    # The node's own private bytes and the machine's largest processes, for
    # `cursio report`; see proc_memory.rs.
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    # SendARP — a peer's hardware address, for Wake-on-LAN; see wake.rs.
    "Win32_NetworkManagement_IpHelper",
    # GetNamedPipeServerProcessId — the drive helper's pipe is checked to be
    # served by the helper this node started; see mount_helper.rs.
    "Win32_System_Pipes",
    # GetLastInputInfo — whether the user is at this machine; see presence.rs.
    "Win32_UI_Input_KeyboardAndMouse",
    # A phone's notifications as toasts, and this machine's own read back to
    # spot duplicates; see notify_toast.rs. COM for the apartment the toast
    # thread joins.
    "Win32_System_Com",
    "Foundation",
    "Foundation_Collections",
    "Data_Xml_Dom",
    "ApplicationModel",
    "UI_Notifications",
    "UI_Notifications_Management",
    # This machine's players, from the system media controls; see
    # media_smtc.rs. Streams for reading a player's cover.
    "Media_Control",
    "Storage_Streams",
] }

[dev-dependencies]
cursio-core-base = { workspace = true, features = ["test-support"] }
# `start_paused` for time-dependent tests (liveness timeouts) — lets a 15s
# timeout elapse in virtual time instead of really waiting.
tokio = { version = "1", features = ["full", "test-util"] }
# The real client against the real apps socket (`apps::serve`'s tests).
cursio-sdk.workspace = true
tempfile.workspace = true
