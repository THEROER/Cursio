[package]
name = "cursio-hubs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# A Windows player's volume is its app's own in the mixer, which only the
# audio crate reaches; see media_smtc.rs.
audio = ["dep:cursio-audio"]

[dependencies]
cursio-core-base.workspace = true
cursio-protocol.workspace = true
cursio-transport.workspace = true

async-trait.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
directories.workspace = true
rand.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true
gio.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
cursio-audio = { workspace = true, optional = true }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    # COM for the apartment the toast thread joins.
    "Win32_System_Com",
    "Win32_System_Registry",
    # GetLastInputInfo and GetTickCount: whether the user is at this machine.
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_SystemInformation",
    "Foundation",
    "Foundation_Collections",
    "Data_Xml_Dom",
    "ApplicationModel",
    "UI_Notifications",
    "UI_Notifications_Management",
    # The system media controls, and streams for reading a player's cover.
    "Media_Control",
    "Storage_Streams",
] }

[dev-dependencies]
cursio-core-base = { workspace = true, features = ["test-support"] }
tokio = { version = "1", features = ["full", "test-util"] }
