[package]
name = "cursio-android"
version.workspace = true
edition.workspace = true

# Linked into the Tauri app's `cursio_app_lib`, the one shared library the
# phone app loads: its JNI exports reach the JVM from there, so this crate is
# not a library of its own on the device.
[lib]
name = "cursio_android"
crate-type = ["rlib"]

[dependencies]
# The mesh core with only the modules that have an Android backend: audio
# (AAudio). Every other module needs one before its feature means anything here.
# By path rather than `workspace = true`: a workspace dependency carries its
# own `default-features`, and a `default-features = false` next to it is
# ignored — which silently pulled PipeWire, FUSE and an AirPlay receiver into a
# phone build. Naming the path here is what actually turns them off.
cursio-core = { path = "../core", default-features = false, features = ["audio", "bluetooth"] }
# For the phone's playback route: the targets and the PCM the JVM captures.
cursio-audio.workspace = true
serde.workspace = true
serde_json.workspace = true
cursio-protocol.workspace = true
cursio-transport.workspace = true
cursio-log.workspace = true

jni = "0.21"
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true

# Route `tracing` into logcat. Without it every log line goes to a file the
# user cannot reach and `adb logcat` shows nothing, which during bring-up is
# indistinguishable from the library never having started.
[target.'cfg(target_os = "android")'.dependencies]
tracing-android = "0.2"
tracing-subscriber.workspace = true
# `__system_property_get`, for the log level a release build is diagnosed at.
libc.workspace = true
