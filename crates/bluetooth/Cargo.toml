[package]
name = "cursio-bluetooth"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cursio-protocol.workspace = true
tracing.workspace = true
thiserror.workspace = true

# BlueZ is reached over the system bus, and the RFCOMM and SCO sockets it
# hands over are plain file descriptors — so zbus and libc, not a Bluetooth
# library that would want to own the adapter alongside PipeWire.
[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true
quick-xml.workspace = true
libc.workspace = true

# Winsock speaks RFCOMM itself, so the mesh channel needs nothing but the
# system's own socket and Bluetooth APIs.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Devices_Bluetooth",
    "Win32_Networking_WinSock",
    "Win32_System_Com",
] }

[dev-dependencies]
tracing-subscriber.workspace = true
