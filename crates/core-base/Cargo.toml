[package]
name = "cursio-core-base"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# `RecordingTx`, the transport the crates above this one test their modules
# against. Their dev-dependencies turn it on.
test-support = []

[dependencies]
cursio-queue.workspace = true
cursio-protocol.workspace = true
cursio-transport.workspace = true

async-trait.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_ignored.workspace = true
bincode.workspace = true
thiserror.workspace = true
# Only in `ModuleFactory::build`'s signature: a module's construction error is
# whatever its platform crate says, and the registry logs it and carries on.
anyhow.workspace = true
tracing.workspace = true
uuid.workspace = true
hostname.workspace = true
directories.workspace = true
toml.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    # OpenProcessToken/GetTokenInformation — are we already elevated?
    "Win32_Security",
    "Win32_System_Threading",
    # GetConsoleWindow — whether a relaunched copy should have a window.
    "Win32_System_Console",
    # ShellExecuteExW with the "runas" verb. SHELLEXECUTEINFOW carries an HKEY
    # field, so the binding is gated on Win32_System_Registry too.
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
    # GetSystemPowerStatus — battery level and mains state for `NodeStatus`.
    "Win32_System_Power",
] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile.workspace = true
