[package]
name = "cursio-files-session"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Mounting a peer's volumes on Windows in this binary: links WinFsp's GPL-3.0
# bindings. Without it a Windows node mounts through the separate
# `cursio-mount-helper` executable instead. See THIRD-PARTY.md.
files-mount = ["cursio-files/mount"]

[dependencies]
cursio-core-base.workspace = true
cursio-protocol.workspace = true
cursio-transport.workspace = true
cursio-files.workspace = true

async-trait.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
directories.workspace = true
# Compresses file chunks when it pays; see files_session::pack.
zstd = "0.13"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    # GetNamedPipeServerProcessId — the drive helper's pipe is checked to be
    # served by the helper this node started; see mount_helper.rs.
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
cursio-core-base = { workspace = true, features = ["test-support"] }
tokio = { version = "1", features = ["full", "test-util"] }
