[package]
name = "cursio-usb"
version.workspace = true
edition.workspace = true

[dependencies]
cursio-protocol.workspace = true
tracing.workspace = true
thiserror.workspace = true

# Enumeration is sysfs, which is ordinary file reads — no libusb, and no
# privilege. Exporting a device needs the kernel's usbip driver instead, which
# is why nothing here links a USB library.
# `usbipd state` emits JSON precisely so it can be read by another program;
# parsing that is a different bet from parsing a table meant for a terminal.
[target.'cfg(target_os = "windows")'.dependencies]
serde_json.workspace = true
# CM_Register_Notification: Windows says when a USB device comes or goes, so
# `usbipd state` is run on a change rather than on a timer.
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
] }

[target.'cfg(target_os = "linux")'.dependencies]

[dev-dependencies]
tempfile = "3"
