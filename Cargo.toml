[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/logging",
    "crates/clipboard-core",
    "crates/transport",
    "crates/airplay",
    "crates/input",
    "crates/window",
    "crates/audio",
    "crates/files",
    "crates/usb",
    "crates/bluetooth",
    "crates/core",
    "crates/android",
    "app",
    "apps/clipd",
    "crates/xtask",
    "tools/wgc-probe",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "TBD"
repository = "https://github.com/THEROER/cursio"

[workspace.dependencies]
# Internal crates
cursio-protocol = { path = "crates/protocol" }
cursio-transport = { path = "crates/transport" }
cursio-bluetooth = { path = "crates/bluetooth" }
cursio-airplay = { path = "crates/airplay" }
cursio-input = { path = "crates/input" }
cursio-audio = { path = "crates/audio" }
cursio-window = { path = "crates/window" }
cursio-files = { path = "crates/files" }
cursio-usb = { path = "crates/usb" }
cursio-core = { path = "crates/core" }
cursio-android = { path = "crates/android" }
cursio-log = { path = "crates/logging" }
clipboard-core = { path = "crates/clipboard-core" }

# Async runtime
async-trait = "0.1.92"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
# Session-bus calls: desktop notifications and Mutter's idle time.
zbus = "5"
# A second `cursio-app` (the Shell menu opening a page, a launcher click)
# hands its arguments to the running one instead of starting another tray.
# Held below 2.5, which requires Tauri 2.12 and would move the whole app's
# Tauri with it.
tauri-plugin-single-instance = "~2.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
plist = "1"

# Discovery
mdns-sd = "0.20"

# Hardware video decode/render
gstreamer = "0.25"
gstreamer-app = "0.25"
# `GstVideoOverlay`, so the sink renders into a window Cursio named itself
# rather than opening its own "Direct3D11 renderer".
gstreamer-video = "0.25"

# Crypto / pairing
aes = "0.8"
ctr = "0.9"
# AirPlay audio packets are AES-128-CBC with the IV reset per packet.
cbc = "0.1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
snow = "0.9"
spake2 = "0.4"
rand = "0.8"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }

# Native build helpers
cc = "1"

# Storage / config
directories = "5"
# Thumbnails of a computer's own photos for the gallery: decoders for what a
# Pictures folder holds, and the JPEG encoder the thumbnails travel as.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
base64 = "0.22"
# `config.toml`: a format people edit by hand, with comments, unlike the JSON
# the trust store and identity are kept in.
toml = "0.8"

# Errors, logging, misc
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
# File logging: non-blocking writer + daily-rotating appender. Pairs with
# tracing-subscriber's fmt layer so the same events go to console and file.
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
hostname = "0.4"
libc = "0.2"
windows-sys = "0.61"
# X11 pointer position for edge crossing under evdev capture. Pure Rust, and
# already in the tree through the clipboard's arboard.
x11rb = "0.13"
