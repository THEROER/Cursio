[package]
name = "cursio-tray"
version.workspace = true
edition.workspace = true
description = "Tray front end for the Cursio daemon"

[[bin]]
name = "cursio-tray"
path = "src/main.rs"

[dependencies]
cursio-log.workspace = true

anyhow.workspace = true
tracing.workspace = true
# The tray icon itself. One crate covering the notification area on Windows,
# the menu bar on macOS and StatusNotifierItem on Linux, so the three
# platforms differ only in how a terminal is opened (see `logs.rs`).
tray-icon = "0.24"
# An event loop for the tray to live on. Every platform demands one on the main
# thread — a Win32 message pump, an NSApplication run loop, GTK's main loop —
# and `tray-icon` delivers its clicks through it. This is also why the daemon
# runs as a child process rather than in a thread here: the mesh's sessions are
# deliberately `!Send` and want a `LocalSet`, which would have to fight this
# loop for the main thread.
tao = "0.36"
